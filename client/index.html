    <script>
      // Diagnostic script error tracking
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
          var details = '';
          if (e.target && (e.target.src || e.target.href)) {
            details = 'Failed to load resource: ' + (e.target.src || e.target.href);
          } else {
            details = (e.message || (e.error && e.error.message) || 'Script execution error') + (e.filename ? ('\nFile: ' + e.filename + ':' + e.lineno + ':' + (e.colno || 0)) : '');
          }
          root.innerHTML = '<div style="padding:2rem;margin:2rem auto;max-width:600px;border:1px solid #fca5a5;background:#fef2f2;border-radius:12px;font-family:sans-serif;color:#991b1b;box-shadow:0 10px 25px rgba(0,0,0,0.05);"><h2 style="margin:0 0 0.5rem 0;font-size:1.25rem;">Application Startup Notice</h2><p style="margin:0 0 0.75rem 0;font-weight:600;">Script load or execution failure</p><pre style="background:#fee2e2;padding:0.75rem;border-radius:6px;font-size:0.8rem;white-space:pre-wrap;overflow-x:auto;">' + details + '</pre><button onclick="location.reload()" style="margin-top:1rem;padding:0.5rem 1.25rem;background:#1e6b3e;color:#fff;border:none;border-radius:6px;font-weight:600;cursor:pointer;">Reload Application</button></div>';
        }
      }, true);
    </script>
